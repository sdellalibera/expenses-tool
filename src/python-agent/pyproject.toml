[project]
name = "expenses-agent"
version = "0.1.0"
description = "Expenses agent built with the Microsoft Agent Framework"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1,<2",

    # Data validation
    "pydantic>=2.5",

    # YAML parsing (Content Understanding emits YAML)
    "pyyaml>=6.0",

    # HTTP client
    "httpx>=0.27",

    # OpenTelemetry (HTTP/protobuf exporter - no grpcio build required)
    "opentelemetry-api>=1.33",
    "opentelemetry-sdk>=1.33",
    "opentelemetry-exporter-otlp-proto-http>=1.33",
    "opentelemetry-instrumentation-fastapi>=0.54b0",
    "opentelemetry-instrumentation-httpx>=0.54b0",

    # Azure
    "azure-identity>=1.19",

    # Microsoft Agent Framework
    "agent-framework-core",
    "agent-framework-foundry",
    "agent-framework-azure-contentunderstanding",
    "mcp>=1.29,<2",

    # Durable cross-session memory (Agent Memory Toolkit on Cosmos DB)
    "agent-framework-azure-cosmos-memory",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["expenses_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
expenses-agent = "expenses_agent.main:main"

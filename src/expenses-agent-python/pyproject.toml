[project]
name = "expenses-agent-python"
version = "0.1.0"
description = "Python-based expenses agent using Microsoft Agent Framework"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "python-multipart",
    "python-dotenv>=1,<2",

    # Data validation
    "pydantic>=2.5.0",

    # YAML parsing (used by parser_tool)
    "pyyaml>=6.0",

    # HTTP client
    "httpx>=0.25.0",

    # OpenTelemetry for observability
    "opentelemetry-api>=1.33.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.33.0",
    "opentelemetry-instrumentation-fastapi>=0.54b0",
    "opentelemetry-sdk>=1.33.0",
    "grpcio>=1.50.0",
    "typing-extensions>=4.12.0",

    # Azure identity
    "azure-identity>=1.15.0",
    "azure-cosmos>=4.7.0",

    # Microsoft Agent Framework dependencies
    "agent-framework",
    "agent-framework-azure",
    "agent-framework-foundry",
    "agent-framework-azure-contentunderstanding",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
]
prerelease = "allow"

[project.scripts]
start = "expenses_agent_python.main:main"

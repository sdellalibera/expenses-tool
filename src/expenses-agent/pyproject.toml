[project]
name = "expenses-agent"
version = "0.1.0"
description = "Expenses agent (Python, Microsoft Agent Framework) — Foundry-hosted target."
readme = "README.md"
requires-python = ">=3.11"

# NOTE: Microsoft Agent Framework packages are currently pre-release (install with --pre).
dependencies = [
    # Core agent framework (includes MCPStreamableHTTPTool, Agent, Content, Message).
    "agent-framework",
    # Foundry chat client (FoundryChatClient) and Content Understanding context provider.
    "agent-framework-foundry",
    "agent-framework-azure-contentunderstanding",
    # Azure auth (managed identity / az login).
    "azure-identity",
    # Web host exposing /chat and /expenses/report for the existing frontend.
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "python-dotenv",
]

[project.scripts]
expenses-agent = "expenses_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["expenses_agent"]
